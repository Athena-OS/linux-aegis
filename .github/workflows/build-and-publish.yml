name: Build and Publish

on:
  push:
    # Only main publishes. Pushes to other branches (PRs, experiments) never
    # build or touch the live repo; use workflow_dispatch to test a branch.
    branches:
      - main
    paths:
      - 'PKGBUILD'
  workflow_dispatch:

permissions:
  contents: read

# Serialize repo-DB updates across workflow runs too, not just across matrix
# legs. Two concurrent pushes would otherwise race on athena.db in R2.
concurrency:
  group: athena-repo-publish
  cancel-in-progress: false

jobs:
  # ===================================================================
  # BUILD - one job per profile, in parallel.
  # Builds and signs packages, then hands them to the publish job as
  # GitHub artifacts. Deliberately does NOT touch the repo DB: that is
  # shared mutable state and must have exactly one writer.
  #
  # Each leg produces three packages for its profile:
  #   linux-aegis-<profile>, -headers, -nvidia-open
  # The NVIDIA modules are built in the SAME leg as their kernel, right
  # after it: they must be compiled against that exact tree and signed with
  # the module-signing key generated during that kernel build. Built in a
  # separate job, they would carry a different signature and be refused
  # under lockdown / Secure Boot.
  #
  # Artifacts are kept for 1 day only, to limit their weight on the
  # account-wide Actions storage quota (kernel packages are large).
  # ===================================================================
  build:
    name: linux-aegis-${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        profile: [offensive, hardened]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup build environment
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chmod -R a+rw .
          sed -i 's/#MAKEFLAGS="-j2"/MAKEFLAGS="-j$(nproc) -l$(nproc)"/g' /etc/makepkg.conf
          sed -i 's/#PACKAGER=".*"/PACKAGER="Athena OS GitHub Actions"/g' /etc/makepkg.conf

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo -n "$GPG_PRIVATE_KEY" | su builder -c \
            "gpg --batch --passphrase '$GPG_PASSPHRASE' --pinentry-mode loopback --import"

          FINGERPRINT=$(su builder -c "gpg --with-colons --fingerprint '$GPG_KEY_ID'" \
            | grep '^fpr' | head -1 | cut -d: -f10)
          echo "$FINGERPRINT:6:" | su builder -c "gpg --import-ownertrust"
          echo "GPGKEY=$GPG_KEY_ID" >> /etc/makepkg.conf

          su builder -c "mkdir -p ~/.gnupg && echo 'pinentry-mode loopback' >> ~/.gnupg/gpg.conf"
          su builder -c "echo 'allow-loopback-pinentry' >> ~/.gnupg/gpg-agent.conf"
          su builder -c "echo 'default-cache-ttl 86400' >> ~/.gnupg/gpg-agent.conf"

          echo "$GPG_PASSPHRASE" | su builder -c \
            "gpg --batch --passphrase-fd 0 --pinentry-mode loopback \
             --sign --armor --output /dev/null /dev/null" 2>/dev/null || true

      - name: Build (${{ matrix.profile }})
        env:
          _aegis_profile: ${{ matrix.profile }}
          # Change _use_llvm_lto from full to thin to decrease the build time on GitHub workflow
          _use_llvm_lto: full
          _processor_opt: generic
          # https://github.com/NVIDIA/open-gpu-kernel-modules/issues/439
          #_use_kcfi: ${{ matrix.profile == 'hardened' && 'yes' || 'no' }}
          _use_kcfi: no
          # Adds the linux-aegis-<profile>-nvidia-open package to this leg.
          _build_nvidia_open: yes
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # Only needed if PKGBUILD's source=() pulls a private Athena-OS repo.
          # sudo -E preserves these, so the step env is enough here.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://${{ secrets.GH_PAT }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          set -euo pipefail
          mkdir -p /tmp/athena-repo

          sudo -H -E -u builder makepkg --skipchecksums --syncdeps \
            --cleanbuild --noconfirm

          echo "$GPG_PASSPHRASE" | su builder -c \
            "gpg --batch --passphrase-fd 0 --pinentry-mode loopback \
             --sign --armor --output /dev/null /dev/null" 2>/dev/null || true

          for pkg in *.pkg.tar.zst; do
            [ -f "$pkg" ] || continue
            echo "Signing $(basename "$pkg")..."
            echo "$GPG_PASSPHRASE" | su builder -c \
              "gpg --batch --passphrase-fd 0 --pinentry-mode loopback \
               --detach-sign --no-armor '$pkg'"
          done

          find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            \( -name "*.pkg.tar.zst" -o -name "*.pkg.tar.zst.sig" \) \
            -exec mv {} /tmp/athena-repo/ \;

          echo "Built artifacts:"
          ls -lh /tmp/athena-repo

      # One artifact per profile (kernel + headers + nvidia-open). Package
      # filenames already encode the profile (linux-aegis-offensive-* vs
      # linux-aegis-hardened-*), so merging them in the publish job cannot
      # cause collisions.
      # compression-level 0: .pkg.tar.zst files are already compressed.
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.profile }}
          path: /tmp/athena-repo/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # ===================================================================
  # PUBLISH - single job, runs once after ALL matrix legs succeed.
  # Sole writer of the repo DB: downloads every profile's packages,
  # runs repo-add ONCE with all of them, uploads, purges cache.
  # ===================================================================
  publish:
    name: Publish to R2
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      REPO_NAME: athena
      REPO_ARCH: x86_64
    steps:
      - name: Setup environment
        run: |
          pacman-key --init
          pacman -Syu aws-cli curl jq --noconfirm --needed
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      # repo-add --sign signs the DB itself, so this job needs the key too.
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo -n "$GPG_PRIVATE_KEY" | su builder -c \
            "gpg --batch --passphrase '$GPG_PASSPHRASE' --pinentry-mode loopback --import"

          FINGERPRINT=$(su builder -c "gpg --with-colons --fingerprint '$GPG_KEY_ID'" \
            | grep '^fpr' | head -1 | cut -d: -f10)
          echo "$FINGERPRINT:6:" | su builder -c "gpg --import-ownertrust"
          echo "GPGKEY=$GPG_KEY_ID" >> /etc/makepkg.conf

          su builder -c "mkdir -p ~/.gnupg && echo 'pinentry-mode loopback' >> ~/.gnupg/gpg.conf"
          su builder -c "echo 'allow-loopback-pinentry' >> ~/.gnupg/gpg-agent.conf"
          su builder -c "echo 'default-cache-ttl 86400' >> ~/.gnupg/gpg-agent.conf"

          echo "$GPG_PASSPHRASE" | su builder -c \
            "gpg --batch --passphrase-fd 0 --pinentry-mode loopback \
             --sign --armor --output /dev/null /dev/null" 2>/dev/null || true

      # Merges every matrix leg's artifact into one dir, so /tmp/athena-repo
      # ends up holding BOTH profiles' packages.
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: /tmp/athena-repo
          merge-multiple: true

      - name: List collected packages
        run: ls -lh /tmp/athena-repo/

      # ---------------------------------------------------------------
      # Download current repo DB from R2, add new packages, re-sign
      # ---------------------------------------------------------------
      - name: Update repository database
        run: |
          set -euo pipefail
          DB_PATH="/tmp/athena-repo"
          REMOTE_PREFIX="s3://$R2_BUCKET/$REPO_NAME/os/$REPO_ARCH"

          # Pull the existing DB (absent on first run)
          aws s3 cp "$REMOTE_PREFIX/$REPO_NAME.db.tar.gz" "$DB_PATH/$REPO_NAME.db.tar.gz" \
            --endpoint-url "$R2_ENDPOINT" || true
          aws s3 cp "$REMOTE_PREFIX/$REPO_NAME.files.tar.gz" "$DB_PATH/$REPO_NAME.files.tar.gz" \
            --endpoint-url "$R2_ENDPOINT" || true

          [ -f "$DB_PATH/$REPO_NAME.db.tar.gz" ] && \
            ln -sf "$REPO_NAME.db.tar.gz" "$DB_PATH/$REPO_NAME.db"
          [ -f "$DB_PATH/$REPO_NAME.files.tar.gz" ] && \
            ln -sf "$REPO_NAME.files.tar.gz" "$DB_PATH/$REPO_NAME.files"

          chown -R builder:builder "$DB_PATH"

          # Single repo-add call with EVERY package from EVERY profile.
          # One read-modify-write, one writer.
          shopt -s nullglob
          PKGS=("$DB_PATH"/*.pkg.tar.zst)
          if [ ${#PKGS[@]} -eq 0 ]; then
            echo "No packages found — nothing to publish."
            exit 1
          fi

          echo "Adding ${#PKGS[@]} package(s) to the DB in one transaction:"
          printf '  %s\n' "${PKGS[@]##*/}"

          su builder -c "repo-add --sign '$DB_PATH/$REPO_NAME.db.tar.gz' ${PKGS[*]@Q}"

      # ---------------------------------------------------------------
      # Upload packages + updated DB to R2
      # ---------------------------------------------------------------
      - name: Upload to R2
        run: |
          set -euo pipefail
          REMOTE_PREFIX="s3://$R2_BUCKET/$REPO_NAME/os/$REPO_ARCH"
          shopt -s nullglob

          # Packages and their signatures
          for file in /tmp/athena-repo/*.pkg.tar.zst \
                      /tmp/athena-repo/*.pkg.tar.zst.sig; do
            echo "Uploading $(basename "$file")..."
            aws s3 cp "$file" "$REMOTE_PREFIX/$(basename "$file")" \
              --endpoint-url "$R2_ENDPOINT"
          done

          # DB archives and their signatures
          for ext in db.tar.gz db.tar.gz.sig files.tar.gz files.tar.gz.sig; do
            file="/tmp/athena-repo/$REPO_NAME.$ext"
            [ -f "$file" ] || continue
            echo "Uploading $REPO_NAME.$ext..."
            aws s3 cp "$file" "$REMOTE_PREFIX/$REPO_NAME.$ext" \
              --endpoint-url "$R2_ENDPOINT"
          done

          # Unversioned names, with signatures matching the served content.
          echo "Uploading unversioned DB names..."
          aws s3 cp "/tmp/athena-repo/$REPO_NAME.db.tar.gz" \
            "$REMOTE_PREFIX/$REPO_NAME.db" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "/tmp/athena-repo/$REPO_NAME.db.tar.gz.sig" \
            "$REMOTE_PREFIX/$REPO_NAME.db.sig" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "/tmp/athena-repo/$REPO_NAME.files.tar.gz" \
            "$REMOTE_PREFIX/$REPO_NAME.files" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "/tmp/athena-repo/$REPO_NAME.files.tar.gz.sig" \
            "$REMOTE_PREFIX/$REPO_NAME.files.sig" --endpoint-url "$R2_ENDPOINT"

          # Old-version cleanup stays commented out, as in the original.
          # Re-enable only after confirming the name-matching logic is correct
          # for multi-profile packages (linux-aegis-offensive vs -hardened share
          # a prefix, so `rev | cut -d- -f4-` may not discriminate them safely).

      # ---------------------------------------------------------------
      # Purge Cloudflare CDN cache for updated files
      # ---------------------------------------------------------------
      - name: Purge edge cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          REPO_BASE_URL="https://hub.athenaos.org/$REPO_NAME/os/$REPO_ARCH"
          URLS=()

          for f in /tmp/athena-repo/*.pkg.tar.zst \
                   /tmp/athena-repo/*.pkg.tar.zst.sig; do
            URLS+=("$REPO_BASE_URL/$(basename "$f")")
          done

          for name in db db.sig db.tar.gz db.tar.gz.sig \
                      files files.sig files.tar.gz files.tar.gz.sig; do
            URLS+=("$REPO_BASE_URL/$REPO_NAME.$name")
          done

          # Cloudflare caps purge_cache at 30 URLs per call — chunk it.
          printf '%s\n' "${URLS[@]}" | split -l 30 - /tmp/purge_chunk_
          for chunk in /tmp/purge_chunk_*; do
            JSON_URLS=$(jq -R . < "$chunk" | jq -s .)
            echo "Purging $(wc -l < "$chunk") URL(s)..."
            curl -s -X POST \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"files\": $JSON_URLS}" | jq .
          done
